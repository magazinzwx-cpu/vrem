<title>Наше время</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&family=Marck+Script&family=Nunito:wght@400;600&display=swap">
<style>
/* Layout: one night sky, a heart that is also a clock face at the top, names in script, six glass tiles ticking below. Single look on purpose: dusk plum, rose glow. */
:root {
  --night: #0e0527;
  --dusk: #2c1164;
  --horizon: #5a28a8;
  --rose: #c77dff;
  --blush: #e6cfff;
  --gold: #ffd89b;
  --ink: #f6f0ff;
  --ink-dim: #b9a6de;
  --glass: rgba(255, 255, 255, 0.07);
  --glass-line: rgba(205, 170, 255, 0.24);
  --font-script: "Marck Script", "Segoe Script", cursive;
  --font-num: "Comfortaa", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: auto; }

body {
  margin: 0;
  background: var(--night) linear-gradient(180deg, var(--night) 0%, var(--dusk) 58%, var(--horizon) 100%) fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 36px;
  min-height: 100vh;
}

#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  display: block;
}

.glow {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.38;
}
.glow.a { width: 60vmax; height: 60vmax; left: -20vmax; bottom: -26vmax; background: #8b3dff; animation: drift-a 26s ease-in-out infinite alternate; }
.glow.b { width: 46vmax; height: 46vmax; right: -16vmax; top: 6vh; background: #c04dff; opacity: 0.28; animation: drift-b 32s ease-in-out infinite alternate; }

@keyframes drift-a { to { transform: translate(8vmax, -6vmax) scale(1.12); } }
@keyframes drift-b { to { transform: translate(-7vmax, 8vmax) scale(0.92); } }

main, .intro {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
}

/* heart clock */
.clock {
  position: relative;
  width: 132px;
  height: 132px;
  flex: none;
}
.clock > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-bg { fill: none; stroke: rgba(205, 170, 255, 0.16); stroke-width: 2; }
.ring { fill: none; stroke: var(--rose); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(199, 125, 255, 0.8)); }
.heart-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
.heart {
  width: 58px;
  height: 58px;
  fill: var(--rose);
  filter: drop-shadow(0 0 14px rgba(199, 125, 255, 0.85));
  transform-origin: 50% 55%;
  animation: beat 1.5s ease-in-out infinite;
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.16); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
  70% { transform: scale(1); }
}

h1 {
  margin: 0;
  font-family: var(--font-script);
  font-weight: 400;
  font-size: clamp(2.9rem, 11vw, 5.4rem);
  line-height: 1.05;
  color: var(--blush);
  text-shadow: 0 0 28px rgba(199, 125, 255, 0.55);
  text-wrap: balance;
}
h1 .amp { color: var(--gold); padding-inline: 0.12em; }

.eyebrow {
  margin: -8px 0 0;
  font-size: 0.8rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

/* tiles */
.tiles {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}
@media (min-width: 760px) {
  .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
}
.tile {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 24px;
  padding: 18px 6px 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  min-width: 0;
}
.tile .n {
  display: block;
  font-family: var(--font-num);
  font-weight: 300;
  font-size: clamp(2.1rem, 7.4vw, 3.3rem);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.tile .u {
  display: block;
  margin-top: 6px;
  font-size: 0.74rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.tile.live { border-color: rgba(199, 125, 255, 0.5); box-shadow: 0 0 30px rgba(199, 125, 255, 0.18); }
.tile.live .n { color: var(--rose); font-weight: 400; }
.pop { animation: pop 0.45s ease-out; }
@keyframes pop {
  0% { transform: translateY(-6px); opacity: 0.2; }
  100% { transform: none; opacity: 1; }
}

.totals {
  margin: 2px 0 0;
  max-width: 34rem;
  color: var(--ink-dim);
  font-size: 0.98rem;
  font-variant-numeric: tabular-nums;
  text-wrap: balance;
}
.totals b { color: var(--blush); font-weight: 600; }

.next {
  margin: 0;
  display: inline-block;
  padding: 8px 18px;
  border: 1px dashed rgba(255, 216, 155, 0.5);
  border-radius: 999px;
  color: var(--gold);
  font-size: 0.95rem;
  text-wrap: balance;
}

.line {
  margin: 6px 0 0;
  max-width: 30rem;
  font-family: var(--font-script);
  font-size: clamp(1.6rem, 5.4vw, 2.3rem);
  line-height: 1.25;
  color: var(--ink);
  text-wrap: balance;
}

.foot {
  margin: 0;
  font-size: 0.82rem;
  color: var(--ink-dim);
  opacity: 0.85;
}

.back {
  font-size: 0.85rem;
  color: var(--ink-dim);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 6px 10px;
  border-radius: 8px;
}
.back:hover { color: var(--blush); }
.back:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* первый экран с кнопкой */
.intro .eyebrow { margin: 0; }
.ask {
  appearance: none;
  border: 1px solid rgba(230, 207, 255, 0.55);
  border-radius: 999px;
  padding: 16px 34px 18px;
  max-width: 100%;
  background: linear-gradient(135deg, #9b4dff 0%, #c77dff 100%);
  color: #fff;
  font-family: var(--font-script);
  font-size: clamp(1.7rem, 6.4vw, 2.3rem);
  line-height: 1.15;
  cursor: pointer;
  text-wrap: balance;
  box-shadow: 0 0 34px rgba(199, 125, 255, 0.55), 0 8px 26px rgba(10, 0, 40, 0.45);
  animation: ask-pulse 2.6s ease-in-out infinite;
  transition: transform 0.2s ease;
}
.ask:hover { transform: scale(1.04); }
.ask:active { transform: scale(0.97); }
.ask:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
@keyframes ask-pulse {
  0%, 100% { box-shadow: 0 0 26px rgba(199, 125, 255, 0.45), 0 8px 26px rgba(10, 0, 40, 0.45); }
  50% { box-shadow: 0 0 52px rgba(199, 125, 255, 0.85), 0 8px 26px rgba(10, 0, 40, 0.45); }
}

main.reveal > * { animation: rise 0.8s ease-out both; }
main.reveal > *:nth-child(2) { animation-delay: 0.12s; }
main.reveal > *:nth-child(3) { animation-delay: 0.22s; }
main.reveal > *:nth-child(4) { animation-delay: 0.34s; }
main.reveal > *:nth-child(5) { animation-delay: 0.5s; }
main.reveal > *:nth-child(6) { animation-delay: 0.62s; }
main.reveal > *:nth-child(7) { animation-delay: 0.74s; }
main.reveal > *:nth-child(8) { animation-delay: 0.98s; }
main.reveal > *:nth-child(9) { animation-delay: 1.1s; }
main.reveal > *:nth-child(10) { animation-delay: 1.2s; }

.more {
  font-size: clamp(1.4rem, 5vw, 1.8rem);
  padding: 12px 28px 14px;
  margin-top: 6px;
}

#pcanvas {
  display: block;
  max-width: 100%;
  filter: drop-shadow(0 0 22px rgba(199, 125, 255, 0.45));
}
.portrait .line { margin: 0; }
.portrait.reveal .pcap { animation: rise 1.2s ease-out 4.6s both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .glow, .heart, .pop, .ask, main.reveal > *, .portrait.reveal .pcap { animation: none; }
  .ask { transition: none; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>

<section class="intro" id="intro">
  <div class="clock" aria-hidden="true">
    <div class="heart-wrap">
      <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
  </div>
  <p class="eyebrow">у меня для тебя кое-что есть</p>
  <button type="button" class="ask" id="ask">Знаешь, сколько мы вместе?</button>
</section>

<main id="stage" hidden>
  <div class="clock" aria-hidden="true">
    <svg viewBox="0 0 132 132">
      <circle class="ring-bg" cx="66" cy="66" r="60"></circle>
      <circle id="ring" class="ring" cx="66" cy="66" r="60" transform="rotate(-90 66 66)"></circle>
    </svg>
    <div class="heart-wrap">
      <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
  </div>

  <h1 id="names"></h1>
  <p class="eyebrow">вместе уже</p>

  <ul class="tiles" role="timer" aria-label="Сколько мы вместе">
    <li class="tile"><span class="n" id="n-y">0</span><span class="u" id="u-y">лет</span></li>
    <li class="tile"><span class="n" id="n-mo">0</span><span class="u" id="u-mo">месяцев</span></li>
    <li class="tile"><span class="n" id="n-d">0</span><span class="u" id="u-d">дней</span></li>
    <li class="tile"><span class="n" id="n-h">0</span><span class="u" id="u-h">часов</span></li>
    <li class="tile"><span class="n" id="n-mi">0</span><span class="u" id="u-mi">минут</span></li>
    <li class="tile live"><span class="n" id="n-s">0</span><span class="u" id="u-s">секунд</span></li>
  </ul>

  <p class="totals" id="totals"></p>
  <p class="next" id="next"></p>
  <p class="line" id="line"></p>
  <button type="button" class="ask more" id="more">Смотри, что ещё есть</button>
  <p class="foot" id="since"></p>
  <a class="back" id="back" href="#start">← на первую страницу</a>
</main>

<section class="intro portrait" id="portrait" hidden>
  <canvas id="pcanvas" role="img" aria-label="Портрет, собранный из маленьких сердечек"></canvas>
  <p class="line pcap" id="pcap"></p>
  <a class="back" id="back2" href="#together">← к счётчику</a>
</section>

<script>
(function () {
  /* ====== Настройки: поменяй под вас ====== */
  var CONFIG = {
    start: new Date(2024, 0, 5, 14, 0, 0),   // год, месяц (0 = январь), день, часы, минуты, секунды
    names: ['Миша', 'Юля'],
    line: 'Каждая секунда с тобой — моя любимая',
    portraitLine: 'Ты — моё любимое сердце'
  };
  /* ======================================== */

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(id) { return document.getElementById(id); }
  function ru(n, f) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return f[2];
    if (b > 1 && b < 5) return f[1];
    if (b === 1) return f[0];
    return f[2];
  }
  function fmt(n) { return Number(n).toLocaleString('ru-RU'); }

  function addMonths(date, n) {
    var d = new Date(date), day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }

  var start = CONFIG.start;
  $('names').innerHTML = CONFIG.names[0] + '<span class="amp">&amp;</span>' + CONFIG.names[1];
  $('line').textContent = CONFIG.line;
  $('since').textContent = 'С ' + start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) +
    ' · нажми на экран, и полетят сердечки';
  document.title = CONFIG.names[0] + ' и ' + CONFIG.names[1] + ' — наше время';

  var cache = {};
  function setText(id, val) {
    if (cache[id] === val) return false;
    cache[id] = val;
    $(id).textContent = val;
    return true;
  }

  function update() {
    var now = new Date();
    if (now < start) now = new Date(start);

    var months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
    if (addMonths(start, months) > now) months--;
    var anchor = addMonths(start, months);
    var rest = Math.floor((now - anchor) / 1000);

    var days = Math.floor(rest / 86400); rest -= days * 86400;
    var hours = Math.floor(rest / 3600); rest -= hours * 3600;
    var mins = Math.floor(rest / 60);
    var secs = rest - mins * 60;
    var years = Math.floor(months / 12);
    var mo = months % 12;

    setText('n-y', years); setText('u-y', ru(years, ['год', 'года', 'лет']));
    setText('n-mo', mo); setText('u-mo', ru(mo, ['месяц', 'месяца', 'месяцев']));
    setText('n-d', days); setText('u-d', ru(days, ['день', 'дня', 'дней']));
    setText('n-h', hours); setText('u-h', ru(hours, ['час', 'часа', 'часов']));
    setText('n-mi', mins); setText('u-mi', ru(mins, ['минута', 'минуты', 'минут']));
    if (setText('n-s', secs) && !reduce) {
      var el = $('n-s');
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
    setText('u-s', ru(secs, ['секунда', 'секунды', 'секунд']));

    var tDays = Math.floor((now - start) / 86400000);
    var tHours = Math.floor((now - start) / 3600000);
    var tSecs = Math.floor((now - start) / 1000);
    var t = 'Это <b>' + fmt(tDays) + '</b> ' + ru(tDays, ['день', 'дня', 'дней']) +
      ', <b>' + fmt(tHours) + '</b> ' + ru(tHours, ['час', 'часа', 'часов']) +
      ' или <b>' + fmt(tSecs) + '</b> ' + ru(tSecs, ['секунда', 'секунды', 'секунд']) + ' рядом';
    if (cache.totals !== t) { cache.totals = t; $('totals').innerHTML = t; }

    var nextN = months + 1;
    var nextDate = addMonths(start, nextN);
    var left = Math.ceil((nextDate - now) / 86400000);
    var what = nextN % 12 === 0
      ? (nextN / 12) + ' ' + ru(nextN / 12, ['год', 'года', 'лет']) + ' вместе'
      : nextN + ' ' + ru(nextN, ['месяц', 'месяца', 'месяцев']) + ' вместе';
    var nx = 'Через ' + left + ' ' + ru(left, ['день', 'дня', 'дней']) + ' будет ' + what;
    setText('next', nx);
  }

  /* кольцо секунд вокруг сердца */
  var ring = $('ring');
  var C = 2 * Math.PI * 60;
  ring.style.strokeDasharray = C;
  function setRing() {
    var n = new Date();
    var p = (n.getSeconds() + n.getMilliseconds() / 1000) / 60;
    ring.style.strokeDashoffset = C * (1 - p);
  }

  /* небо: звёзды, сердечки, падающие звёзды */
  var cv = $('sky'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var stars = [], hearts = [], shoots = [];
  var heartPath = new Path2D('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
  var palette = ['199,125,255', '230,207,255', '255,216,155', '160,100,255'];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var count = Math.round(W * H / 5200);
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.3 + 0.3,
        ph: Math.random() * 6.28, sp: Math.random() * 1.6 + 0.4,
        warm: Math.random() < 0.25
      });
    }
  }

  function spawnHeart(x, y, burst) {
    hearts.push({
      x: x, y: y,
      vy: -(burst ? Math.random() * 1.2 + 1.0 : Math.random() * 0.5 + 0.35),
      vx: burst ? (Math.random() - 0.5) * 1.4 : 0,
      s: burst ? Math.random() * 18 + 14 : Math.random() * 16 + 9,
      a: burst ? 0.9 : Math.random() * 0.35 + 0.18,
      ph: Math.random() * 6.28, sw: Math.random() * 0.8 + 0.4,
      c: palette[Math.floor(Math.random() * palette.length)],
      life: 0
    });
    if (hearts.length > 140) hearts.shift();
  }

  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = reduce ? 0.8 : 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = (s.warm ? 'rgba(255,216,155,' : 'rgba(247,240,255,') + tw.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
  }

  var last = 0, nextAmbient = 0, nextShoot = 4;
  function frame(ms) {
    var t = ms / 1000, dt = Math.min(t - last, 0.05); last = t;
    ctx.clearRect(0, 0, W, H);
    drawStars(t);

    if (!reduce) {
      if (t > nextAmbient) { spawnHeart(Math.random() * W, H + 20, false); nextAmbient = t + 0.7 + Math.random() * 1.1; }
      if (t > nextShoot) {
        shoots.push({ x: Math.random() * W * 0.8 + W * 0.2, y: Math.random() * H * 0.35, vx: -(380 + Math.random() * 200), vy: 160 + Math.random() * 90, life: 0 });
        nextShoot = t + 6 + Math.random() * 8;
      }

      for (var i = shoots.length - 1; i >= 0; i--) {
        var sh = shoots[i];
        sh.life += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt;
        var al = Math.max(0, 1 - sh.life / 1.1);
        var g = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 0.12, sh.y - sh.vy * 0.12);
        g.addColorStop(0, 'rgba(247,240,255,' + al + ')');
        g.addColorStop(1, 'rgba(247,240,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - sh.vx * 0.12, sh.y - sh.vy * 0.12); ctx.stroke();
        if (sh.life > 1.1) shoots.splice(i, 1);
      }

      for (var j = hearts.length - 1; j >= 0; j--) {
        var h = hearts[j];
        h.life += dt;
        h.y += h.vy * 60 * dt;
        h.x += (h.vx + Math.sin(t * h.sw + h.ph) * 0.35) * 60 * dt;
        h.vx *= 0.985;
        var fade = Math.min(1, h.life * 2) * Math.max(0, Math.min(1, (h.y + 40) / (H * 0.25)));
        if (h.y < -40 || fade <= 0) { hearts.splice(j, 1); continue; }
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(Math.sin(t * h.sw + h.ph) * 0.25);
        var k = h.s / 24;
        ctx.scale(k, k);
        ctx.translate(-12, -12);
        ctx.shadowColor = 'rgba(' + h.c + ',0.9)';
        ctx.shadowBlur = 14 / k;
        ctx.fillStyle = 'rgba(' + h.c + ',' + (h.a * fade).toFixed(3) + ')';
        ctx.fill(heartPath);
        ctx.restore();
      }
      setRing();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
